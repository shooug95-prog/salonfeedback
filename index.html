<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تقييم صالون لمسة نونه</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f5;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .welcome {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .stars {
      display: flex;
      justify-content: center;
      direction: ltr;
      gap: 8px;
      margin: 15px 0;
    }

    .star {
      font-size: 40px;
      cursor: pointer;
      color: #ccc;
    }

    .star.active {
      color: #f5b400;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #7b4b63;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💜 تقييم صالون لمسة نونه</h1>

    <p class="welcome">
      يسعدنا معرفة رأيك في الخدمة المقدمة لك
    </p>

    <form id="feedbackForm">

      <label for="name">الاسم</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="اكتبي اسمك"
        required
      >

      <label for="phone">رقم الجوال</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="05xxxxxxxx"
      >

      <label for="service">الخدمة</label>
      <input
        type="text"
        id="service"
        name="service"
        placeholder="مثال: علاج الشعر"
      >

      <label>كيف تقيمين الخدمة؟</label>

      <div class="stars" id="stars">

        <span class="star" data-rating="1">★</span>
        <span class="star" data-rating="2">★</span>
        <span class="star" data-rating="3">★</span>
        <span class="star" data-rating="4">★</span>
        <span class="star" data-rating="5">★</span>

      </div>

      <input
        type="hidden"
        id="rating"
        name="rating"
        value=""
      >

      <label for="comment">ملاحظاتك</label>

      <textarea
        id="comment"
        name="comment"
        placeholder="اكتبي لنا رأيك أو ملاحظاتك..."
      ></textarea>

      <button type="submit" id="submitButton">
        إرسال التقييم
      </button>

    </form>

    <div id="message"></div>

  </div>


  <script>

    const stars = document.querySelectorAll(".star");
    const ratingInput = document.getElementById("rating");

    stars.forEach((star) => {

      star.addEventListener("click", () => {

        const rating = Number(star.dataset.rating);

        ratingInput.value = rating;

        stars.forEach((s) => {

          const starRating = Number(s.dataset.rating);

          if (starRating <= rating) {
            s.classList.add("active");
          } else {
            s.classList.remove("active");
          }

        });

      });

    });


    const form = document.getElementById("feedbackForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.textContent = "";
      message.className = "";


      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const service = document.getElementById("service").value.trim();
      const rating = document.getElementById("rating").value;
      const comment = document.getElementById("comment").value.trim();


      if (!rating) {

        message.textContent = "فضلاً اختاري عدد النجوم ⭐";
        message.className = "error";

        return;
      }


      submitButton.disabled = true;
      submitButton.textContent = "جاري إرسال التقييم...";


      try {

        const response = await fetch(
          "https://salonfeedback.onrender.com/feedback",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              name: name,
              phone: phone,
              service: service,
              rating: Number(rating),
              comment: comment

            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.message || "حدث خطأ في السيرفر"
          );

        }


        message.textContent =
          "تم إرسال التقييم بنجاح 💜 شكراً لك";

        message.className = "success";


        form.reset();

        ratingInput.value = "";

        stars.forEach((star) => {
          star.classList.remove("active");
        });


      } catch (error) {

        console.error("Feedback Error:", error);

        message.textContent =
          "حدث خطأ في السيرفر، يرجى المحاولة مرة أخرى.";

        message.className = "error";

      } finally {

        submitButton.disabled = false;
        submitButton.textContent = "إرسال التقييم";

      }

    });

  </script>

</body>

</html>
