<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم - لمسة نونه</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 30px;
    margin: 0;
}

h2 {
    color: #8e44ad;
    text-align: center;
    margin-bottom: 20px;
}

.search-box {
    text-align: center;
    margin-bottom: 20px;
}

#search {
    width: 300px;
    max-width: 90%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

th,
td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #8e44ad;
    color: white;
}

tr:nth-child(even) {
    background: #fafafa;
}

.whatsapp {
    display: inline-block;
    background: #25D366;
    color: white;
    padding: 8px 14px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: bold;
}

.whatsapp:hover {
    opacity: 0.85;
}

.no-data {
    text-align: center;
    padding: 20px;
    color: #777;
}

</style>

</head>

<body>

<h2>💜 لوحة تقييمات صالون لمسة نونه</h2>

<div class="search-box">

<input
    id="search"
    type="text"
    placeholder="🔎 ابحثي باسم العميلة..."
    oninput="loadData"
>

</div>

<div class="table-container">

<table>

<thead>

<tr>
    <th>الاسم</th>
    <th>رقم الجوال</th>
    <th>الخدمة</th>
    <th>التقييم</th>
    <th>التعليق</th>
    <th>التاريخ</th>
    <th>واتساب</th>
</tr>

</thead>

<tbody id="table">

<tr>
    <td colspan="7">جاري تحميل التقييمات...</td>
</tr>

</tbody>

</table>

</div>

<script>

async function loadData() {

    try {

        const response = await fetch("/feedback");

        if (!response.ok) {
            throw new Error("فشل تحميل التقييمات");
        }

        const data = await response.json();

        const search =
            document.getElementById("search").value
            .toLowerCase()
            .trim();

        const table = document.getElementById("table");

        const filteredData = data.filter(item => {

            const name = item.name || "";

            return name
                .toLowerCase()
                .includes(search);

        });

        if (filteredData.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="no-data">
                        لا توجد تقييمات
                    </td>
                </tr>
            `;

            return;
        }

        let html = "";

        filteredData.forEach(item => {

            let phone = item.phone || "";

            let whatsappButton = "—";

            if (phone) {

                phone = phone.replace(/\D/g, "");

                if (phone.startsWith("05")) {
                    phone = "966" + phone.substring(1);
                }

                else if (phone.startsWith("5")) {
                    phone = "966" + phone;
                }

                const message = encodeURIComponent(
`السلام عليكم 🌸

شكرًا لزيارتك صالون لمسة نونه 💜

نسعد بتقييمك لتجربتك معنا عبر الرابط:

https://salonfeedback.onrender.com`
                );

                whatsappButton = `
                    <a
                        class="whatsapp"
                        href="https://wa.me/${phone}?text=${message}"
                        target="_blank">
                        💬 إرسال
                    </a>
                `;
            }

            html += `

                <tr>

                    <td>${item.name || "—"}</td>

                    <td>${item.phone || "—"}</td>

                    <td>${item.service || "—"}</td>

                    <td>${item.rating || "—"} ⭐</td>

                    <td>${item.comment || "—"}</td>

                    <td>${item.date || "—"}</td>

                    <td>${whatsappButton}</td>

                </tr>

            `;

        });

        table.innerHTML = html;

    }

    catch (error) {

        console.error(error);

        document.getElementById("table").innerHTML = `

            <tr>

                <td colspan="7" class="no-data">

                    ❌ حدث خطأ أثناء تحميل التقييمات

                </td>

            </tr>

        `;

    }

}

loadData();

</script>

</body>

</html>
