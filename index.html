<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تقييم صالون لمسة نونه</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #fafafa;
            padding: 40px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        input, textarea, select {
            width: 90%;
            margin: 10px;
            padding: 10px;
        }

        button {
            padding: 12px 30px;
            background: #8e44ad;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 15px;
        }
    </style>

</head>


<body>

<div class="box">

<h2>💜 تقييم صالون لمسة نونه</h2>


<input id="name" placeholder="اسم العميلة">
<input id="phone" placeholder="رقم الجوال (05xxxxxxxx)">

<textarea id="comment" placeholder="اكتبي تقييمك"></textarea>


<select id="rating">
    <option value="5">⭐⭐⭐⭐⭐</option>
    <option value="4">⭐⭐⭐⭐</option>
    <option value="3">⭐⭐⭐</option>
    <option value="2">⭐⭐</option>
    <option value="1">⭐</option>
</select>


<br>

<button onclick="sendFeedback()">
إرسال التقييم
</button>


<p id="result"></p>


</div>


<script>

async function sendFeedback() {


   const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const comment = document.getElementById("comment").value;
const rating = document.getElementById("rating").value;


    if (!name || !comment) {
        alert("يرجى تعبئة جميع الحقول");
        return;
    }


    try {

        const response = await fetch("https://salonfeedback.onrender.com/feedback, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

           body: JSON.stringify({

    name,
    phone,
    comment,
    rating

})

        });


        const data = await response.json();


        document.getElementById("result").innerHTML = data.message;


        document.getElementById("name").value = "";
document.getElementById("phone").value = "";
document.getElementById("comment").value = "";


    }


    catch(error) {

        document.getElementById("result").innerHTML =
        "حدث خطأ في الاتصال بالسيرفر";

        console.log(error);

    }


}


</script>


</body>

</html>
