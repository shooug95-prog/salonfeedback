<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>لوحة التحكم - لمسة نونه</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:30px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border:1px solid #ddd;
}

th{
background:#8e44ad;
color:white;
}

h2{
color:#8e44ad;
}

</style>

</head>

<body>

<h2>💜 لوحة تقييمات صالون لمسة نونه</h2>
<input
id="search"
placeholder="🔎 ابحثي باسم العميلة..."
onkeyup="loadData()"
style="
width:300px;
padding:10px;
margin:20px;
border-radius:8px;
border:1px solid #ccc;
">
<table>

<thead>

<tr>

<th>الاسم</th>

<th>التقييم</th>

<th>التعليق</th>

<th>التاريخ</th>
<th>واتساب</th>
</tr>

</thead>

<tbody id="table">

</tbody>

</table>

<script>

async function loadData(){

const response=await fetch("/all-feedback");

const data=await response.json();
const search = document.getElementById("search").value.toLowerCase();
let html="";

data
.filter(item =>
item.name.toLowerCase().includes(search)
)
.forEach(item=>{

html+=`

<tr>

<td>${item.name}</td>

<td>${item.rating} ⭐</td>

<td>${item.comment}</td>

<td>${new Date(item.date).toLocaleString()}</td>
<td>
<a
href="https://wa.me/966${item.phone.substring(1)}?text=${encodeURIComponent(
`السلام عليكم 🌸

شكراً لزيارتك صالون لمسة نونه 💜

نسعد بتقييمك لتجربتك معنا عبر الرابط:

http://localhost:3000`
)}"
target="_blank">

💬 إرسال

</a>
</td>ٍ
</tr>

`;

});

document.getElementById("table").innerHTML=html;

}

loadData();

</script>

</body>

</html>
