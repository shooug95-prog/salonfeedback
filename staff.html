<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>إرسال رابط التقييم</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
padding:40px;
}

.box{
background:#fff;
width:400px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 0 10px #ddd;
}

input{
width:90%;
padding:12px;
margin:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px 25px;
background:#8e44ad;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

</style>

</head>

<body>

<div class="box">

<h2>💜 إرسال رابط التقييم</h2>

<input id="name" placeholder="اسم العميلة">

<input id="phone" placeholder="05xxxxxxxx">

<button onclick="sendLink()">

💬 إرسال رابط التقييم

</button>

</div>

<script>

function sendLink(){

const name=document.getElementById("name").value;

const phone=document.getElementById("phone").value;

if(!name || !phone){

alert("أكملي البيانات");

return;

}

const link="http://localhost:3000";

const message=

`السلام عليكم 🌸

${name}

شكراً لزيارتك صالون لمسة نونه 💜

نسعد بتقييم تجربتك عبر الرابط:

${link}`;

window.open(

`https://wa.me/966${phone.substring(1)}?text=${encodeURIComponent(message)}`,

"_blank"

);

}

</script>

</body>

</html>
